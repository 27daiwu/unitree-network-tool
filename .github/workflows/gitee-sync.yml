# GitHub -> Gitee automatic sync for 27daiwu/unitree-network-tool
#
# What it does
#   1. mirror-repo   : mirrors all branches and tags to Gitee with plain git
#                      over HTTPS (token auth). force-push + prune keeps Gitee
#                      an exact mirror of GitHub; GitHub stays untouched.
#   2. sync-releases : mirrors GitHub Release metadata (tag, title, body,
#                      prerelease) and every asset (EXE/ZIP/...) to Gitee via
#                      Gitee API v5, verifying SHA256 on both sides.
#
# Required repository secret (Settings -> Secrets and variables -> Actions)
#   GITEE_TOKEN  Gitee private token of the repo owner
#                (https://gitee.com/profile/personal_access_tokens)
#                - scope: projects (repo/release/asset read+write)
#
# Why plain git instead of Yikun/hub-mirror-action?
#   hub-mirror-action pushes over SSH (port 22), which hangs indefinitely from
#   GitHub-hosted (Azure) runners to gitee.com - verified 2026-11-13: a mirror
#   run hung for 35+ minutes without ever reaching the git timeout. The HTTPS
#   push below performs the identical mirror refspec (all branches + all tags,
#   force, prune) over port 443 and completes in seconds. Auth goes through
#   git's credential store so the token never appears in URLs or logs.
#
# Triggers
#   - release published        : full sync of the new release (code, tags, release)
#   - push to main             : code/tags mirror only (keeps Gitee consistent)
#   - manual (workflow_dispatch): options below
#       tag           sync one specific release tag (empty = latest)
#       sync_all      backfill every historical release (oldest first, idempotent)
#       skip_repo_sync skip the code/tags mirror (e.g. retry a failed release sync)
#
# Failure handling
#   - every HTTP call retries with backoff; uploads re-verify SHA256 and retry
#   - both jobs wrap their core step in nick-fields/retry (3 attempts)
#   - all operations are idempotent: re-running (manually or via "Re-run jobs")
#     never duplicates data; matching files are skipped, mismatches repaired
#   - concurrency group serializes runs, keeping only the newest queued run
#   - GitHub releases are never modified or deleted by this workflow

name: Sync to Gitee

on:
  release:
    types: [published]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to sync (e.g. v2.1.0); empty = latest'
        type: string
        required: false
        default: ''
      sync_all:
        description: 'Backfill all historical releases (oldest first)'
        type: boolean
        required: false
        default: false
      skip_repo_sync:
        description: 'Skip code/tags mirror (release sync only)'
        type: boolean
        required: false
        default: false

concurrency:
  group: gitee-sync
  cancel-in-progress: false

permissions:
  contents: read

env:
  GITHUB_SYNC_REPO: 27daiwu/unitree-network-tool
  GITEE_OWNER: daiwu27
  GITEE_REPO: unitree-network-tool

jobs:
  mirror-repo:
    name: Mirror code & tags to Gitee
    if: ${{ !inputs.skip_repo_sync }}
    runs-on: ubuntu-latest
    steps:
      - name: Check Gitee token is configured
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          if [ -z "$GITEE_TOKEN" ]; then
            echo "::error::Secret GITEE_TOKEN is not configured."
            echo "::error::See the header comment of .github/workflows/gitee-sync.yml for setup steps."
            exit 1
          fi

      - name: Mirror branches and tags (git over HTTPS, token auth)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 15
          max_attempts: 3
          retry_wait_seconds: 30
          command: |
            set -euo pipefail
            git clone --bare "https://github.com/${GITHUB_SYNC_REPO}.git" repo.git
            cd repo.git
            # Feed the Gitee token to git's credential store (ephemeral runner
            # disk only). The push URL stays clean, so logs and error messages
            # never contain the token.
            git config credential.helper store
            printf 'protocol=https\nhost=gitee.com\nusername=%s\npassword=%s\n' \
              "${GITEE_OWNER}" "${GITEE_TOKEN}" | git credential approve
            git remote add gitee "https://gitee.com/${GITEE_OWNER}/${GITEE_REPO}.git"
            git push --force gitee 'refs/heads/*:refs/heads/*' --tags --prune
            echo "Mirror pushed, Gitee refs now:"
            git ls-remote gitee | sed 's/^/  /'
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}

  sync-releases:
    name: Sync releases & assets to Gitee
    needs: mirror-repo
    if: >-
      !cancelled() &&
      (github.event_name == 'release' || github.event_name == 'workflow_dispatch') &&
      (needs.mirror-repo.result == 'success' || needs.mirror-repo.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout workflow scripts
        uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: .github

      - name: Sync releases to Gitee (with retry)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 90
          max_attempts: 3
          retry_wait_seconds: 60
          command: |
            ARGS="--github-repo $GITHUB_SYNC_REPO --gitee-owner $GITEE_OWNER --gitee-repo $GITEE_REPO"
            if [ -n "$SYNC_TAG" ]; then ARGS="$ARGS --tag $SYNC_TAG"; fi
            if [ "$SYNC_ALL" = "true" ]; then ARGS="$ARGS --all"; fi
            python3 .github/scripts/sync_releases_to_gitee.py $ARGS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          SYNC_TAG: ${{ inputs.tag || github.event.release.tag_name }}
          SYNC_ALL: ${{ inputs.sync_all }}
